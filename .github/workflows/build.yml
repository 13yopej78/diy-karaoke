name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04  # comes with the Android SDK preinstalled
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk diy-karaoke.apk

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest diy-karaoke.apk \
            --title "DIY Karaoke (build ${{ github.run_number }})" \
            --notes "Install on the Shield with the Downloader app using this link: https://github.com/${{ github.repository }}/releases/latest/download/diy-karaoke.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: diy-karaoke-apk
          path: diy-karaoke.apk
