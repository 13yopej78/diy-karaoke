plugins {
    id 'com.android.application'
}

android {
    namespace 'com.diykaraoke.tv'
    compileSdk 34

    defaultConfig {
        applicationId "com.diykaraoke.tv"
        minSdk 24
        // Target 29 on purpose: lets the app read karaoke files (.cdg, .zip, .kar)
        // straight from a USB drive on the Shield (Android 11) using legacy storage.
        targetSdk 29
        versionCode (System.getenv("GITHUB_RUN_NUMBER") ? System.getenv("GITHUB_RUN_NUMBER").toInteger() : 1)
        versionName "1.0." + (System.getenv("GITHUB_RUN_NUMBER") ?: "0")
    }

    signingConfigs {
        shared {
            // Fixed key kept in the repo so every new build installs over the old one.
            storeFile file("diykaraoke.jks")
            storePassword "diykaraoke"
            keyAlias "diykaraoke"
            keyPassword "diykaraoke"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
        debug {
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'com.google.zxing:core:3.5.3'
}
