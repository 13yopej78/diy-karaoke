<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; background: #000; height: 100%; overflow: hidden; }
  #p { width: 100vw; height: 100vh; }
</style>
</head>
<body>
<div id="p"></div>
<script>
  var vid = new URLSearchParams(location.search).get('v');
  var player = null, ready = false;

  function bridge(fn, arg) {
    try {
      if (!window.Android) return;
      if (arg === undefined) Android[fn](); else Android[fn](arg);
    } catch (e) {}
  }

  function onYouTubeIframeAPIReady() {
    player = new YT.Player('p', {
      width: '100%', height: '100%', videoId: vid,
      playerVars: { autoplay: 1, controls: 0, rel: 0, playsinline: 1, iv_load_policy: 3, fs: 0, origin: location.origin },
      events: {
        onReady: function (e) { ready = true; e.target.playVideo(); },
        onStateChange: function (e) {
          bridge('state', e.data);
          if (e.data === 0) bridge('ended');
        },
        onError: function (e) { bridge('error', e.data); }
      }
    });
  }

  function togglePause() {
    if (!player || !ready) return;
    if (player.getPlayerState() === 1) player.pauseVideo(); else player.playVideo();
  }

  function restart() {
    if (player && ready) { player.seekTo(0, true); player.playVideo(); }
  }

  // No internet / YouTube unreachable: report an error so the queue moves on.
  setTimeout(function () { if (!ready) bridge('error', -1); }, 25000);
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
